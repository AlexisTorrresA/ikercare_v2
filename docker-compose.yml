services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iker_care}
      POSTGRES_USER: ${POSTGRES_USER:-iker_care}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iker_care} -d ${POSTGRES_DB:-iker_care}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - iker_care_network

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-iker_care}:${POSTGRES_PASSWORD:-change-me-db}@db:5432/${POSTGRES_DB:-iker_care}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${APP_PORT:-8080}}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      CHILD_NAME: ${CHILD_NAME:-Iker}
      HOSPITAL_NAME: ${HOSPITAL_NAME:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Santiago}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-8}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:-}
    ports:
      - "${APP_PORT:-8080}:8000"
    networks:
      - iker_care_network

volumes:
  postgres_data:

networks:
  iker_care_network:
