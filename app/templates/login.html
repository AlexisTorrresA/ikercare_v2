<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#365fcb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ingreso · IkerCare</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="brand brand-centered">
        <span class="brand-mark">IC</span>
        <div>
          <h1>IkerCare</h1>
          <p>Registro diario hospitalario</p>
        </div>
      </div>

      <div class="safety-note">
        Esta aplicación ayuda a registrar información. No reemplaza la indicación médica ni las alarmas del hospital.
      </div>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" class="stack-form">
        <label>
          Usuario
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label>
          Contraseña
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button button-primary button-full" type="submit">Entrar</button>
      </form>

      <p class="muted small">La cuenta inicial se configura en el archivo <code>.env</code>.</p>
    </section>
  </main>
</body>
</html>
