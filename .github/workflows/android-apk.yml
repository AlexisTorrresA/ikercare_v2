name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IkerCare-Android-v2-debug
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
