name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app/*.py
      - name: JavaScript syntax
        run: node --check app/static/v2.js
      - name: Tests
        run: pytest -q
